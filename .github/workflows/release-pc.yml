name: Release PC

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: yarn
      
      - name: Build the web assets
        run: yarn build

      - name: Build electron and Publish
        run: yarn electron:build --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}