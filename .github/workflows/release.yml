name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: yarn
      
      - name: Build the web assets
        run: yarn build

      - name: Setup Java
        if: runner.os == 'macOS'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Setup Android SDK
        if: runner.os == 'macOS'
        uses: android-actions/setup-android@v2
        with:
          api-level: 30
          target: android-30
          ndk: 21.4.7075529

      - name: Decode Keystore
        if: runner.os == 'macOS'
        run: |
          echo ${{ secrets.KEYSTORE_FILE }} | base64 --decode > my-release-key.keystore

      - name: Build android
        if: runner.os == 'macOS'
        run: yarn android:build
      
      - name: Sign APK
        if: runner.os == 'macOS'
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore my-release-key.keystore \
          -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
          -keypass ${{ secrets.KEY_PASSWORD }} \
          android/app/build/outputs/apk/release/app-release-unsigned.apk ${{ secrets.KEY_ALIAS }}

      - name: Align APK (optional but recommended)
        if: runner.os == 'macOS'
        run: |
          ${ANDROID_HOME}/build-tools/30.0.3/zipalign -v 4 \
          android/app/build/outputs/apk/release/app-release-unsigned.apk electron-dist/app-release.apk

      - name: Build electron and Publish
        run: yarn electron:build --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}